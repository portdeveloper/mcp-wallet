name: mcp-wallet

x-app: &app
  build:
    context: .
    target: development
  env_file:
    - path: .env
      required: true
  environment:
    DATABASE_URL: postgresql://mcp_wallet:mcp_wallet@postgres:5432/mcp_wallet
    NODE_OPTIONS: --conditions=development
  volumes:
    - .:/app
    - node_modules:/app/node_modules
  init: true

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mcp_wallet
      POSTGRES_PASSWORD: mcp_wallet
      POSTGRES_USER: mcp_wallet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_wallet -d mcp_wallet"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: pnpm db:migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: pnpm --filter @mcp-wallet/api dev
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  web:
    <<: *app
    command: pnpm --filter @mcp-wallet/web dev
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 4s
      retries: 30
    restart: unless-stopped

  worker:
    <<: *app
    command: pnpm --filter @mcp-wallet/worker dev
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  node_modules:
  postgres_data:
